preprocessing:
  mode: "waveformer"            # "waveformer" (signed bipolar sEMG / 128 + DC removal)
  fs: 200                       # Sampling rate in Hz
  channels: 8                   # Myo armband sEMG channels
  scale_divisor: 128.0          # Scales signed int8 Myo [-128, 127] -> [-1, 1]
  hand_choice: "right"          # "right" or "left" (remaps [6,5,4,3,2,1,0,7])
  remove_dc: true               # Zero-mean per window while preserving contraction RMS
  median_filter_size: 3         # Legacy compatibility
  medfilt_order: "before_rec"

model:
  arch: "waveformer"
  num_classes: 6                # 0:Relax, 1:Open, 2:Close, 3:Wave-In, 4:Wave-Out, 5:Pinch
  channels: 8
  input_channels: 1
  window_size: 200              # 1.0 s window at 200 Hz (WaveFormer 200 Hz Myo config)
  patch_size: [1, 20]           # 8 x 10 = 80 tokens (+ 1 [CLS] = 81 tokens)
  embed_dim: 256
  depth: 6
  num_heads: 8
  mlp_ratio: 2.0                # ~3.2M total params (matches WaveFormer paper ~3.1M)
  wt_levels: 3                  # 3-level 2D Haar (db1) wavelet conv
  wt_type: "db1"
  wt_kernel_size: 3
  highfreq_dropout: 0.1
  dropout: 0.1
  drop_path: 0.1

train:
  data_root: "data/raw/reactemg"
  cache_dir: "data/processed/waveformer"
  dataset_selection: "epn_only" # 6-class EMG-EPN-612 (all 6 gestures across subjects)
  epn_subset_percentage: 0.25   # ~77 subjects (subject-disjoint train/val split)
  max_files: null
  window_stride: 40
  rescaling_range: [0.55, 1.80] # Amplitude robustness across Myo fit/strength
  jitter_sigma: 0.004
  batch_size: 256
  epochs: 16
  lr: 0.0005
  min_lr: 0.000001
  weight_decay: 0.01
  warmup_epochs: 3
  label_smoothing: 0.05
  grad_clip: 1.0
  saved_checkpoint_pth: null
  val_split_ratio: 0.10         # 10% unseen subjects held out for validation
  seeds: [42]
  device: "cuda"

eval:
  window_size: 200
  step_size: 20                 # 10 Hz streaming evaluation cadence
  max_files: 600
