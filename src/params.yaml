preprocessing:
  fs: 200                 # Hz, recordings are resampled to this rate
  bandpass: [15, 95]      # Hz
  notch: 50               # Hz

train:
  val_subjects: [19]
  test_subjects: [20]
  epochs: 15
  k: 5                    # kernel-training example = k stateful inputs (capped by the shortest recording)
  example_stride: 40      # raw samples between training examples
  activation: tanh        # tanh or relu
  normalization: subject  # EMG z-score: none, subject or set (pooled over each set's subjects)
  aug_gain: 0.0           # training examples only: std of the log per-channel gain; 0 = off
  aug_rotate: 0           # training examples only: max rotation around the electrode ring, whole electrodes; 0 = off
  aug_shift: 0.0          # training examples only: max fractional shift around the ring, electrodes; 0 = off
  batch_size: 256
  lr: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
  seeds: [0, 1, 2]
  device: cuda
