preprocessing:
  fs: 200                       # Sampling rate in Hz
  channels: 8                   # Myo armband sEMG channels
  median_filter_size: 3         # Kernel size for 1D temporal median filter
  medfilt_order: "before_rec"   # "before_rec" (paper default) or "after_rec"
  scale_divisor: 128.0          # Scales rectified int8 Myo [-128, 127] -> [0, 1]
  hand_choice: "right"          # "right" or "left" (remaps [6,5,4,3,2,1,0,7])

model:
  num_classes: 6                # 0:Relax, 1:Open, 2:Close, 3:Wave-In, 4:Wave-Out, 5:Pinch (6:<MASK>)
  window_size: 600              # 3.0 s context window at 200 Hz
  embedding_dim: 128
  nhead: 4
  num_layers: 2
  dropout: 0.15
  activation: "gelu"
  embedding_method: "linear_projection"
  mask_alignment: "aligned"
  share_pe: true
  tie_weight: false
  use_input_layernorm: true
  output_reduction_method: "none"
  chunk_size: 0

train:
  data_root: "data/raw/reactemg"
  dataset_selection: "pub_with_epn" # "epn_only" or "pub_with_epn" for 6-class training
  epn_subset_percentage: 1.0
  window_stride: 30             # 150 ms sliding stride during training
  task_selection: [0, 1, 2]     # 0=action_rec, 1=emg_rec, 2=joint_rec, 3=unlabeled_emg
  lambda_poisson: 7.0
  sampling_probability_poisson: 0.99
  poisson_mask_range: [0.3, 0.75]
  end_mask_range: [0.3, 0.6]
  transition_buffer: 30
  with_training_curriculum: false
  scale_emg_loss: 0             # 0: L_emg + L_act, 1: 100*L_emg + L_act
  noise: 0.0
  batch_size: 128
  epochs: 12
  lr: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_decay_method: "linear"     # "linear", "cosine", or "exponential"
  grad_clip: 1.0
  saved_checkpoint_pth: null    # Train from scratch per user decision
  val_split_ratio: 0.05         # 5% held-out files for pub_with_epn / epn_only validation
  seeds: [42]
  device: "cuda"

eval:
  buffer_range: 200             # +-0.5 s reaction buffer (200 samples @ 200 Hz)
  lookahead: 50                 # Smoothed look-ahead mode: 50 samples (0.25 s)
  samples_between_prediction: 20 # Hold period s = 20 samples (10 Hz)
  stride: 1
  maj_vote_range: "future"
  likelihood_format: "probs"
  weight_max_factor: 1.5
  weighting_method: "equal"
  allow_relax: 0
  strict_transition: 0
