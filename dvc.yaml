stages:
  build_dataset:
    cmd: python scripts/build_dataset.py
    deps:
      - scripts/build_dataset.py
      - src/dataset.py
      - src/preprocess.py
    params:
      - src/params.yaml:
          - preprocessing
    outs:
      - data/processed/emg_fk

  train:
    cmd: python scripts/train.py
    deps:
      - data/processed/emg_fk
      - scripts/train.py
      - src/dataset.py
      - src/model
      - src/trainer.py
    params:
      - src/params.yaml:
          - train
    outs:
      - output

metrics:
  - output/metrics.json

plots:
  - output/history.csv:
      x: epoch
