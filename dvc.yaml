stages:
  build_dataset:
    cmd: python scripts/build_dataset.py
    deps:
      - scripts/build_dataset.py
      - src/dataset.py
      - src/preprocess.py
    params:
      - src/params.yaml:
          - preprocessing
          - model.num_classes
          - train.data_root
          - train.dataset_selection
          - train.epn_subset_percentage
    outs:
      - data/processed/waveformer

  train:
    cmd: python scripts/train.py
    deps:
      - data/processed/waveformer
      - scripts/train.py
      - src/dataset.py
      - src/model
      - src/preprocess.py
      - src/trainer.py
    params:
      - src/params.yaml:
          - model
          - train
          - eval
    outs:
      - output/best_model.pt

  evaluate:
    cmd: python scripts/evaluate.py
    deps:
      - output/best_model.pt
      - scripts/evaluate.py
      - src/dataset.py
      - src/model
    params:
      - src/params.yaml:
          - eval
    metrics:
      - output/metrics.json

plots:
  - output/history.csv:
      x: epoch
